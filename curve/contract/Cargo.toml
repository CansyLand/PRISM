[package]
name = "curve-ledger"
version = "0.1.0"
edition = "2021"
description = "Continuous-expiry power-perpetual ledger + treasury (Curve / Flat sides), oracle-priced, fully collateralized"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dependencies]
near-sdk = "5"
near-contract-standards = "5"
uint = { version = "0.9", default-features = false }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
