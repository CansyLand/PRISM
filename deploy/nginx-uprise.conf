# Uprise: https://uprise.wtf → the app on 127.0.0.1:8795 (uprise-app.service).
# www.uprise.wtf redirects permanently to https://uprise.wtf (one domain for search engines).
# Installed as /etc/nginx/sites-available/uprise.wtf, certificate "uprise.wtf" from certbot (uprise.wtf + www.uprise.wtf).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uprise.wtf;
    ssl_certificate /etc/letsencrypt/live/uprise.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uprise.wtf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/uprise.access.log;
    error_log  /var/log/nginx/uprise.error.log;
}

server {
    # www over https: permanent redirect to uprise.wtf
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.uprise.wtf;
    ssl_certificate /etc/letsencrypt/live/uprise.wtf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uprise.wtf/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://uprise.wtf$request_uri;
}

server {
    # plain http: both names go to https://uprise.wtf
    listen 80;
    listen [::]:80;
    server_name uprise.wtf www.uprise.wtf;
    return 301 https://uprise.wtf$request_uri;
}
