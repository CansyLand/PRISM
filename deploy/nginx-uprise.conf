# Uprise: https://uprise.wtf → the app on 127.0.0.1:8795 (uprise-app.service).
# www.uprise.wtf and the old uprise.parutkin.com redirect permanently to https://uprise.wtf (one domain for search engines).
# Installed as /etc/nginx/sites-available/uprise.parutkin.com. The certificate (named uprise.parutkin.com by certbot) covers all three names.
server {
    server_name uprise.wtf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/uprise.access.log;
    error_log  /var/log/nginx/uprise.error.log;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/uprise.parutkin.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/uprise.parutkin.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # other names over https: permanent redirect to uprise.wtf
    server_name www.uprise.wtf uprise.parutkin.com;
    return 301 https://uprise.wtf$request_uri;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/uprise.parutkin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uprise.parutkin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    # plain http: every name goes to https://uprise.wtf
    listen 80;
    listen [::]:80;
    server_name uprise.wtf www.uprise.wtf uprise.parutkin.com;
    return 301 https://uprise.wtf$request_uri;
}
