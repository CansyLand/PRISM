# Uprise: uprise.wtf, www.uprise.wtf and uprise.parutkin.com → the app on 127.0.0.1:8795 (uprise-app.service).
# Installed as /etc/nginx/sites-available/uprise.parutkin.com; certbot adds the TLS part.
# To add the real domain, see deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name uprise.parutkin.com uprise.wtf www.uprise.wtf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/uprise.access.log;
    error_log  /var/log/nginx/uprise.error.log;
}
