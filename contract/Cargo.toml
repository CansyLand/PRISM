[package]
name = "uprise-ledger"
version = "0.1.0"
edition = "2021"
description = "Uprise ledger: continuous-expiry power perpetual (Curve Long / Curve Short), oracle-priced, fully collateralized"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"
uint = { version = "0.9", default-features = false }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
