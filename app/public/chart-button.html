<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chart button ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  body { padding: 24px 16px 60px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .wrap > h1 { font-size: 30px; letter-spacing: -.02em; margin: 0 0 4px; }
  .wrap > p { margin: 0 0 22px; max-width: 640px; line-height: 1.45; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .idea h2 { font-size: 15px; margin: 0 0 4px; }
  .idea > p { margin: 0 0 8px; font-size: 13px; color: var(--muted); line-height: 1.4; min-height: 36px; }
  .mock { padding: 12px; }
  .mock .px { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .mock svg.ch { width: 100%; height: 110px; display: block; margin-top: 4px; }
  .cbar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .cbar .chip { padding: 6px 10px; }
  .cbar .cta { margin-left: auto; }
  .cta { font: inherit; cursor: pointer; border: 0; white-space: nowrap; }
  /* the email field that opens in the card, no popup */
  .join { display: none; gap: 6px; margin-top: 8px; }
  .open .join { display: flex; animation: drop .25s ease-out; }
  .join input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 9px 11px; outline: none; }
  .join input:focus { border-color: var(--accent); }
  .join button { border: 0; border-radius: 10px; background: var(--ink); color: var(--panel); font-weight: 700; padding: 0 14px; cursor: pointer; }
  .done { display: none; margin-top: 8px; font-weight: 700; font-size: 13.5px; }
  .sent .join { display: none; } .sent .done { display: block; animation: drop .25s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-4px); } }

  /* the wiggle: short, rare, random per button (JS adds .wig) */
  @keyframes wig { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-7deg) scale(1.06); } 30% { transform: rotate(6deg) scale(1.06); } 45% { transform: rotate(-4deg); } 60% { transform: rotate(3deg); } 75% { transform: rotate(-1deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0) rotate(var(--r, 0deg)); } 30% { transform: translateY(-6px) rotate(var(--r, 0deg)); } 55% { transform: translateY(0) rotate(var(--r, 0deg)); } 70% { transform: translateY(-2px) rotate(var(--r, 0deg)); } }
  @keyframes ring { 0%,100% { transform: rotate(0); } 10%,30%,50% { transform: rotate(18deg); } 20%,40%,60% { transform: rotate(-18deg); } 70% { transform: rotate(0); } }
  .cta.wig { animation: wig .7s ease-in-out; }
  @media (prefers-reduced-motion: reduce) { .cta.wig, .cta.wig * { animation: none !important; } }

  /* 1 · ticket stub */
  .c1 { background: var(--ink); color: var(--panel); font-weight: 700; font-size: 13px; padding: 7px 12px 7px 10px; border-radius: 6px; position: relative;
        -webkit-mask: radial-gradient(circle 5px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
                mask: radial-gradient(circle 5px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
  .c1 i { font-style: normal; border-right: 1.5px dashed color-mix(in srgb, var(--panel) 55%, transparent); padding-right: 7px; margin-right: 7px; }
  /* 2 · bell pill */
  .c2 { background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 99px; }
  .c2 span { display: inline-block; transform-origin: 50% 10%; }
  .c2.wig { animation: none; } .c2.wig span { animation: ring .9s ease-in-out; }
  /* 3 · real money arrow */
  .c3 { background: transparent; color: var(--ink); font-weight: 700; font-size: 13px; padding: 6px 10px; border: 1.5px solid var(--ink); border-radius: 99px; }
  .c3 b { display: inline-block; transition: transform .2s; } .c3:hover b { transform: translateX(3px); }
  /* 4 · sticker, white edge */
  .c4 { --r: -6deg; background: var(--crab); color: var(--ink); font-weight: 800; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 8px; border: 2.5px solid #fff; box-shadow: 0 2px 0 rgba(29,21,48,.25); transform: rotate(var(--r)); }
  .c4.wig { animation: hop .7s ease-out; }
  /* 5 · join the herd */
  .c5 { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px 4px 4px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .c5 em { font-style: normal; background: var(--panel); border-radius: 99px; width: 24px; height: 24px; display: grid; place-items: center; }
  .c5 small { color: var(--muted); font-weight: 600; }
  /* 6 · place in line, live counter */
  .c6 { background: var(--ink); color: var(--panel); border-radius: 10px; padding: 5px 10px; text-align: left; line-height: 1.1; display: inline-flex; flex-direction: column; }
  .c6 small { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; } .c6 b { font-size: 13.5px; }
  .c6 b i { font-style: normal; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--crab); margin-right: 5px; vertical-align: 1px; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  /* 7 · envelope with dot */
  .c7 { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; position: relative; padding: 0; }
  .c7 svg { width: 17px; height: 17px; }
  .c7::after { content: "1"; position: absolute; top: -3px; right: -3px; min-width: 16px; height: 16px; border-radius: 99px; background: var(--down); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--panel); }
  /* 8 · rubber stamp */
  .c8 { --r: 4deg; background: transparent; color: var(--down); border: 2px dashed var(--down); border-radius: 6px; padding: 4px 9px; font-weight: 800; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; transform: rotate(var(--r)); }
  .c8.wig { animation: stamp .55s ease-out; }
  @keyframes stamp { 0% { transform: rotate(var(--r)) scale(1); } 35% { transform: rotate(var(--r)) scale(1.25); opacity: .6; } 60% { transform: rotate(var(--r)) scale(.94); opacity: 1; } 100% { transform: rotate(var(--r)) scale(1); } }
  /* 9 · split pill that becomes the field */
  .c9 { display: inline-flex; align-items: stretch; border-radius: 99px; overflow: hidden; border: 1.5px solid var(--ink); background: var(--panel); padding: 0; font-weight: 700; font-size: 13px; }
  .c9 span { padding: 6px 10px; } .c9 b { background: var(--ink); color: var(--panel); padding: 6px 10px; }
  .i9.open .join { display: none; } .i9.open .c9 { display: none; }
  .i9 .inl { display: none; margin-left: auto; flex: 1; max-width: 190px; border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden; background: var(--panel); }
  .i9.open:not(.sent) .inl { display: flex; animation: drop .25s ease-out; }
  .i9 .inl input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 10px; outline: none; font-size: 13px; }
  .i9 .inl button { border: 0; background: var(--ink); color: var(--panel); padding: 0 11px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chart button · 9 ideas</h1>
  <p>The button sits on the right of the time-frame chips. Clicking it opens an email field inside the chart card, so there's no popup. Each button wiggles every few seconds at a random time. Click one to try it.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const ideas = [
  ["1 · Ticket stub", "A mainnet ticket with a torn edge. It sets up the “You're #214” reward.", `<button class="cta c1"><i>🎟️</i>Mainnet</button>`],
  ["2 · Ringing bell", "Cobalt like Buy. The bell rings instead of the whole button shaking.", `<button class="cta c2"><span>🔔</span> Notify me</button>`],
  ["3 · Real money soon", "Ink outline, calm. Works against play money without shouting.", `<button class="cta c3">Real money soon <b>→</b></button>`],
  ["4 · Sticker", "Orange sticker with a white edge, like the x¹⁰ celebration. It hops.", `<button class="cta c4">Get in early</button>`],
  ["5 · Join the herd", "🐮 brand voice plus social proof from the waitlist count.", `<button class="cta c5"><em>🐮</em>Join the herd <small>214</small></button>`],
  ["6 · Live line", "The blinking dot says the list is moving. It shows the next place in line.", `<button class="cta c6"><small>Mainnet line</small><b><i></i>#215 · join</b></button>`],
  ["7 · Envelope badge", "Smallest option: an icon with an unread dot. Curiosity does the work.", `<button class="cta c7" aria-label="Get mainnet news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></button>`],
  ["8 · Rubber stamp", "Dashed rose stamp. It stamps down instead of shaking.", `<button class="cta c8">Mainnet soon</button>`],
  ["9 · Opens in place", "Label and arrow. On click, the pill becomes the email field in the same spot.", `<button class="cta c9"><span>Early access</span><b>✉</b></button>`],
];
const chart = (seed) => { let y = 70, d = ""; for (let i = 0; i <= 40; i++) { y += Math.sin(i * .7 + seed) * 6 - 1.1; d += (i ? "L" : "M") + (i * 7.5) + " " + y.toFixed(1); } return d; };
document.getElementById("grid").innerHTML = ideas.map(([t, why, btn], i) => `
  <div class="idea ${i === 8 ? "i9" : ""}"><h2>${t}</h2><p>${why}</p>
  <section class="card mock">
    <div class="chart-head"><span class="muted small">NEAR / USD</span><span class="tag">Testnet</span></div>
    <div class="px num">$3.4${i}</div>
    <svg class="ch" viewBox="0 0 300 110" preserveAspectRatio="none"><path d="${chart(i)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/></svg>
    <div class="cbar"><button class="chip">5M</button><button class="chip">1H</button><button class="chip" aria-pressed="true">1D</button><button class="chip">1W</button>${btn}
      ${i === 8 ? `<form class="inl"><input type="email" placeholder="you@mail.com" required><button>→</button></form>` : ""}</div>
    <form class="join"><input type="email" placeholder="Email for mainnet day" required><button>Join</button></form>
    <div class="done">🎟️ You're #215 in line. We'll email you once, on mainnet day.</div>
  </section></div>`).join("");

document.querySelectorAll(".idea").forEach((el) => {
  el.querySelector(".cta").onclick = () => { el.classList.add("open"); el.querySelector("input").focus(); };
  el.querySelectorAll("form").forEach((f) => (f.onsubmit = (e) => { e.preventDefault(); el.classList.add("sent"); }));
});
// wiggle: each button on its own random 4–9 s timer, never while it's open
document.querySelectorAll(".cta").forEach((b) => {
  const go = () => { if (!b.closest(".open")) { b.classList.remove("wig"); void b.offsetWidth; b.classList.add("wig"); } setTimeout(go, 4000 + Math.random() * 5000); };
  b.addEventListener("animationend", () => b.classList.remove("wig"));
  setTimeout(go, 800 + Math.random() * 3000);
});
</script>
</body>
</html>
